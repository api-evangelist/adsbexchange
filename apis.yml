- aid: adsbexchange:adsbexchange-geospatial-filtering-api
  name: ADS-B Exchange Geospatial Filtering API
  description: >-
    Endpoints allow filtering live data based on geospatial boundaries, such as latitude, longitude, altitudes,
    or even custom GeoJSON shapes.

    Use these endpoints to get information about aircraft within a specific radius from a given point,
    within a polygon, or within a custom shape.

    <br /><br />

    <b>Note</b>: When using GeoJSON shape files, only Polygon and MultiPolygon shapes are supported. Any
    other shapes will be ignored.
