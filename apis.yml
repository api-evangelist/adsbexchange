apis:
- aid: adsbexchange:adsbexchange-geopolitical-filtering-api
  name: ADS-B Exchange Geopolitical Filtering API
  description: >-
    Allows filtering live data based on geopolitical boundaries, such as states/provinces, countries,
    regions, or even continents.

    All endpoints support ISO 3166-1 alpha-2 country codes and ISO 3166-2 subdivision (states/provinces)
    codes.

    <br /><br />

    World boundaries are based on <a href="https://public.opendatasoft.com/explore/dataset/world-administrative-boundaries/map/"
    target="_blank">OpenDataSoft</a> dataset.

    <b>Attribution:</b><br />

    This API includes data from <a href="https://marineregions.org/" target="_blank">Marine Regions</a>,
    licensed under

    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">Creative Commons Attribution
    4.0 International (CC BY 4.0)</a>.<br />

    <i>Flanders Marine Institute (2023). Maritime Boundaries Geodatabase, version 12. DOI: <a href="https://doi.org/10.14284/632"
    target="_blank">10.14284/632</a></i>
