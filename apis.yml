- aid: adsbexchange:adsbexchange-live-positional-data-api
  name: ADS-B Exchange Live Positional Data API
  description: >-
    Endpoints provide access to airborne or recently landed aircraft, as well as last known positions.

    Use these endpoints to get information about aircraft, such as location, flight, altitude, speed,
    and many more.

    <br /><br />

    Comprehensive filtering by various parameters is supported - such as ICAO hex code, registration,
    squawk, etc.

    See documentation to learn more about available endpoints and their parameters.

    <br /><br />

    For more information about properties returned, please navigate to <a href="https://www.adsbexchange.com/version-2-api-wip/"
    target="_blank">Version 2 API Fields</a> documentation.
